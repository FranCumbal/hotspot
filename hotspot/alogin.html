<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Conectando...</title>
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="-1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #000;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    #connect-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      text-align: center;
      padding: 40px;
    }
    
    .spinner {
      width: 60px; height: 60px;
      border: 5px solid rgba(255,255,255,0.1);
      border-top-color: #e63946;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    
    @keyframes spin { to { transform: rotate(360deg); } }
    
    h2 { font-size: 22px; font-weight: 600; }
    p  { font-size: 13px; color: rgba(255,255,255,0.45); }
  </style>
</head>
<body>

  <div id="connect-screen">
    <div class="spinner"></div>
    <h2>¡Conexión Exitosa!</h2>
    <p>Ya tienes acceso a Internet. Serás redirigido en un momento...</p>
  </div>

  <script>
    // Leemos la variable de MikroTik como si fuera texto de JavaScript para evitar errores en el editor
    var isPopup = "$(popup)";
    
    // Mostrar el popup de status de MikroTik si está configurado en el router
    if (isPopup === 'true') {
      open('$(link-status)', 'hotspot_status', 'toolbar=0,location=0,directories=0,status=0,menubars=0,resizable=1,width=290');
    }

    // Redirigir a la página web final (la que el usuario quería visitar) en 1.5 segundos
    setTimeout(() => { location.href = '$(link-redirect)'; }, 1500);
  </script>
</body>
</html>
