<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Conexión Exitosa</title>
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="-1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #f4f4f4; /* Un gris muy clarito y elegante */
      color: #333;
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    #success-screen {
      background: #fff;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      text-align: center;
    }

    .check-icon {
      width: 60px; height: 60px;
      background: #6fae4f;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
    }
    
    h2 { font-size: 22px; font-weight: 600; color: #333; margin: 0; }
    p  { font-size: 14px; color: #666; margin: 0; }
  </style>
</head>
<body>

  <div id="success-screen">
    <div class="check-icon">✓</div>
    <h2>¡Conexión Exitosa!</h2>
    <p>Ya tienes acceso a Internet. Serás redirigido en un momento...</p>
  </div>

  <script>
    // Mostrar el popup de status de MikroTik si está configurado
    var isPopup = "$(popup)";
    if (isPopup === 'true') {
      open('$(link-status)', 'hotspot_status', 'toolbar=0,location=0,directories=0,status=0,menubars=0,resizable=1,width=290');
    }

    // Redirigir a la página web final en 1.5 segundos
    setTimeout(() => { location.href = '$(link-redirect)'; }, 1500);
  </script>
</body>
</html>
