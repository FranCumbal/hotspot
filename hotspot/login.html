<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Login</title>
<meta http-equiv="pragma" content="no-cache" />
<meta http-equiv="expires" content="-1" />	
<meta name="viewport" content="width=device-width; initial-scale=1.0; maximum-scale=1.0; user-scalable=0;" />
<link rel="stylesheet" href="login.css" media="screen">
</head>
<body class='login'>

$(if chap-id)
	<form name="sendin" action="$(link-login-only)" method="post">
		<input type="hidden" name="username" />
		<input type="hidden" name="password" />
		<input type="hidden" name="dst" value="$(link-orig)" />
		<input type="hidden" name="popup" value="true" />
	</form>
	
	<script type="text/javascript" src="/md5.js"></script>
	<script type="text/javascript">
	</script>
$(endif)

<form id="main-login-form" class="vertical-form" name="login" action="$(link-login-only)" method="post" background="#A03472">
<input type="hidden" name="dst" value="$(link-orig)" />
<input type="hidden" name="popup" value="true" />
<div style="margin:0;padding:0;display:inline"></div>
<legend>

<aqui se puede escribir>
</legend>
<div id="wifi"></div>
<input autocomplete="on" name="username" placeholder="Username" type="text" value="$(username)" size="15" />
<input autocomplete="off" name="password" placeholder="Password" type="password" label="false" size="15" />

<input type="submit" value=" " />

<img class="logo" src="bg.png" />
<div class='footer'>
<p>$(if trial == 'yes')Free trial available, <a href="$(link-login-only)?dst=$(link-orig-esc)&amp;username=T-$(mac-esc)">click here</a>.$(endif)</p>
<p>$(if error)<span style="color: #7F7F7F; font-size: 16px">$(error)</span>$(endif)</p>
<br>
<p>
</p>
</div>
</form>

<div id="video-screen">
  <video id="promo-video" playsinline disablePictureInPicture controlsList="nodownload nofullscreen noremoteplayback">
    <source id="video-src" src="" type="video/mp4">
  </video>
  <div id="progress-bar">
    <div id="progress-track"><div id="progress-fill"></div></div>
    <span id="time-label">0:00 / 0:00</span>
  </div>
</div>

<div id="connect-screen">
  <div class="connect-box">
    <div class="spinner"></div>
    <h2>Conectando a Internet...</h2>
    <p>Validando credenciales, por favor espera.</p>
  </div>
</div>

<script type="text/javascript">
</script>

<script type="text/javascript">
  document.oncontextmenu = function(){return false;}

  // ── LÓGICA DE VIDEO ──
  const VIDEO_SERVER = 'http://192.168.2.240:8080';
  const TOTAL_VIDEOS = 21;
  const num = Math.floor(Math.random() * TOTAL_VIDEOS) + 1;
  document.getElementById('video-src').src = VIDEO_SERVER + '/VIDEO' + num + '.mp4';
  
  const videoEl = document.getElementById('promo-video');
  videoEl.load();

  // Interceptar el envío del formulario para mostrar el video primero
  const loginForm = document.getElementById('main-login-form');
  loginForm.addEventListener('submit', function(e) {
    e.preventDefault(); 
    
    // Ocultar formulario de forma segura
    document.querySelector('.vertical-form').style.display = 'none';
    const imgLogo = document.querySelector('.logo');
    if(imgLogo) imgLogo.style.display = 'none';
    
    // Mostrar video y reproducir
    document.getElementById('video-screen').classList.add('visible');
    videoEl.play();
  });

  // Bloqueo de teclado
  document.addEventListener('keydown', e => {
     if(document.getElementById('video-screen').classList.contains('visible')) {
         e.preventDefault();
     }
  });

  // Actualización de tiempo
  function formatTime(s) {
    const m = Math.floor(s / 60);
    const ss = Math.floor(s % 60).toString().padStart(2, '0');
    return m + ':' + ss;
  }

  videoEl.addEventListener('timeupdate', () => {
    if (!videoEl.duration) return;
    const pct = (videoEl.currentTime / videoEl.duration) * 100;
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('time-label').textContent = formatTime(videoEl.currentTime) + ' / ' + formatTime(videoEl.duration);
  });

  // Evento al terminar el video
  function finalizarYConectar() {
    // 1. Quitar el video y mostrar Inmediatamente el spinner de carga
    document.getElementById('video-screen').classList.remove('visible');
    document.getElementById('connect-screen').classList.add('visible');

    // 2. Enviar la información al router usando javascript seguro
    var chapId = "$(chap-id)"; 
    if (chapId !== "") {
      // Verificación extra de seguridad para MikroTik
      if (typeof doLogin === 'function') {
        doLogin(); 
      }
    } else {
      // Usamos el método absoluto del prototipo para ignorar cualquier conflicto de nombres en el formulario
      HTMLFormElement.prototype.submit.call(document.getElementById('main-login-form'));
    }
  }

  videoEl.addEventListener('ended', finalizarYConectar);
  videoEl.addEventListener('error', finalizarYConectar); 
</script>
</body>
</html>
